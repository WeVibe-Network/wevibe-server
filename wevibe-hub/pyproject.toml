[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wevibe-hub"
version = "0.2.0"
description = "WeVibe Network managed API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "asyncpg>=0.29",
    "stripe>=8.0",
    "wevibe-sdk>=0.1.0",
    "wevibe-guard>=0.1.0",
]

[project.scripts]
wevibe-hub = "wevibe_hub.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["wevibe_hub"]
